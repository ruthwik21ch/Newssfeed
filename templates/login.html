<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Headline Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --surface: #0f1623;
            --border: rgba(255,255,255,0.07);
            --accent: #4f8eff;
            --accent-glow: rgba(79,142,255,0.3);
            --text: #e8edf5;
            --muted: #6b7a99;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed; inset: 0; z-index: 0;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: drift 12s ease-in-out infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: #4f8eff; top: -150px; left: -150px; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: #a855f7; bottom: -100px; right: -100px; animation-delay: -4s; }
        .orb-3 { width: 300px; height: 300px; background: #06b6d4; bottom: 30%; left: 30%; animation-delay: -8s; }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, 30px) scale(1.08); }
        }

        /* Grid overlay */
        .grid-overlay {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .card {
            position: relative; z-index: 10;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            width: 420px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 36px;
            animation: fadeUp 0.6s 0.15s forwards; opacity: 0;
        }
        .brand-icon {
            width: 36px; height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .brand-icon svg { width: 18px; height: 18px; fill: white; }
        .brand-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800; font-size: 1.1rem;
            color: var(--text); letter-spacing: -0.02em;
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 1.9rem;
            color: var(--text); letter-spacing: -0.03em;
            margin-bottom: 6px;
            animation: fadeUp 0.6s 0.2s forwards; opacity: 0;
        }
        .subtitle {
            color: var(--muted); font-size: 0.9rem; margin-bottom: 36px;
            animation: fadeUp 0.6s 0.25s forwards; opacity: 0;
        }

        .field {
            margin-bottom: 18px;
            animation: fadeUp 0.6s forwards; opacity: 0;
        }
        .field:nth-child(1) { animation-delay: 0.3s; }
        .field:nth-child(2) { animation-delay: 0.35s; }

        label {
            display: block; font-size: 0.78rem; font-weight: 500;
            color: var(--muted); letter-spacing: 0.05em;
            text-transform: uppercase; margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        input::placeholder { color: var(--muted); }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(79,142,255,0.05);
        }

        button {
            width: 100%; padding: 15px;
            background: var(--accent);
            color: white; border: none; border-radius: 12px;
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem; font-weight: 600;
            cursor: pointer; margin-top: 8px;
            position: relative; overflow: hidden;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: transform 0.15s, box-shadow 0.15s;
            animation: fadeUp 0.6s 0.4s forwards; opacity: 0;
        }
        button::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0; transition: opacity 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px var(--accent-glow); }
        button:hover::after { opacity: 1; }
        button:active { transform: translateY(0); }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0;
            animation: fadeUp 0.6s 0.45s forwards; opacity: 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .divider span { color: var(--muted); font-size: 0.8rem; }

        .register-link {
            display: block; text-align: center;
            color: var(--muted); font-size: 0.9rem;
            text-decoration: none;
            animation: fadeUp 0.6s 0.5s forwards; opacity: 0;
        }
        .register-link span { color: var(--accent); font-weight: 500; transition: opacity 0.2s; }
        .register-link:hover span { opacity: 0.8; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
<div class="grid-overlay"></div>

<div class="card">
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16v3H4zm0 6h10v3H4zm0 6h13v3H4z"/></svg>
        </div>
        <span class="brand-name">NewsFeed</span>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account to continue</p>

    <form method="POST">
        <div class="field">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit">Sign In →</button>
    </form>

    <div class="divider"><span>New here?</span></div>
    <a class="register-link" href="/register">Don't have an account? <span>Create one</span></a>
</div>

</body>
</html>
